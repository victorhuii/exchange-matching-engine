name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python scripts/build.py
      - run: python -m unittest discover -s tests -v
      - run: node --check web/app.js
      - run: node --test tests/frontend.test.cjs
      - name: Address and undefined behavior sanitizers
        run: |
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer src/engine.cpp -o build/engine-sanitized
          for profile in mixed deep cancel-burst sweep; do
            build/engine-sanitized --benchmark 2000 --profile "$profile"
          done
